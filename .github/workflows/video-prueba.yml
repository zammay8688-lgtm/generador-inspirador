name: Crear video de prueba
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crear-video:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas de video y piano
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fluidsynth fluid-soundfont-gm
          pip install -r requirements-video.txt
      - name: Crear video animado con piano
        run: python crear_video.py
      - name: Guardar video para descargar
        uses: actions/upload-artifact@v4
        with:
          name: video-inspirador-del-dia
          path: video-del-dia.mp4
          retention-days: 7
