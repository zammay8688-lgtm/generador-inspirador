<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generador inspirador</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#020617;color:#fff;font-family:Arial}.app{max-width:1150px;margin:auto}.grid{display:grid;grid-template-columns:1fr 350px;gap:22px}.card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:22px;padding:18px}canvas{width:100%;border-radius:16px}input,button{width:100%;padding:13px;margin-top:10px;border-radius:11px;border:1px solid #ffffff22}input{background:#0f172a;color:white}button{font-weight:bold;cursor:pointer}.primary{background:#22d3ee;color:#082f49}.secondary{background:#ffffff18;color:white}label{display:block;margin-top:15px;color:#cbd5e1}.status{color:#86efac;min-height:30px;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><h1>Generador diario de inspiración</h1><p>Crea una imagen con fecha, frase y fotografía de fondo, sin pagar suscripciones.</p><div class="grid"><div class="card"><canvas id="c" width="1080" height="1080"></canvas></div><div class="card"><h2>Personalizar</h2><p>El fondo automático cambia según el día.</p><button class="secondary" id="auto">Usar fondo automático del día</button><label>Imagen de fondo opcional</label><input id="f" type="file" accept="image/*"><button class="secondary" id="q">Quitar imagen</button><label>Nombre o firma</label><input id="m" value="Inspira tu día" maxlength="40"><button class="secondary" id="x">Cambiar frase y diseño</button><button class="primary" id="d">Descargar PNG</button><div class="status" id="s"></div><p>La imagen elegida se procesa únicamente en tu navegador.</p></div></div></div><script>
const F=["Cada mañana trae una nueva oportunidad para avanzar.","Los pequeños pasos de hoy construyen los grandes logros de mañana.","Confía en tu proceso, incluso cuando avances lentamente.","Tu actitud puede transformar por completo tu día.","Hoy tienes una nueva oportunidad para hacerlo mejor.","La constancia convierte los sueños en resultados.","No necesitas ser perfecto, solo seguir avanzando.","Cree en ti y en todo lo que todavía puedes lograr.","Cada esfuerzo cuenta, aunque nadie más lo vea.","Tu mejor momento para comenzar es ahora.","Haz de este día una razón para sentirte orgulloso.","Avanza con calma, pero nunca abandones tu camino.","Hoy puede ser el inicio de algo extraordinario.","Respira, reorganiza tus ideas y vuelve a intentarlo.","Celebra tus avances, incluso los que parecen pequeños.","Nunca subestimes el poder de volver a comenzar.","Haz lo mejor que puedas con lo que tienes hoy.","La gratitud convierte lo cotidiano en algo extraordinario.","Tu paz también es una prioridad.","Un buen día comienza con una buena intención."];
const T=[["#071952","#35A29F","#FFE17B"],["#3D246C","#F875AA","#FFD6A5"],["#163020","#B6C4B6","#EEF0E5"],["#001C30","#64CCC5","#DAFFFB"],["#111827","#7C3AED","#FDE68A"]],D=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"],M=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const ahora=new Date(),key=`${ahora.getFullYear()}-${ahora.getMonth()+1}-${ahora.getDate()}`;let H={};try{H=JSON.parse(localStorage.getItem('historial-frases')||'{}')}catch(e){}let i=H[key]?.i??ahora.getDate()%F.length,t=H[key]?.t??ahora.getDate()%T.length,img=null;const fondos=['fondos/fondo-01.jpg','fondos/fondo-02.jpg','fondos/fondo-03.jpg','fondos/fondo-04.jpg','fondos/fondo-05.jpg','fondos/fondo-06.jpg','fondos/fondo-07.jpg'];const c=document.getElementById('c'),g=c.getContext('2d'),marca=document.getElementById('m'),estado=document.getElementById('s');
function lineas(txt,max){let a=[],l='';for(const p of txt.split(' ')){let z=(l+' '+p).trim();if(g.measureText(z).width>max&&l){a.push(l);l=p}else l=z}a.push(l);return a}function draw(){const p=T[t];if(img){let e=Math.max(1080/img.width,1080/img.height),w=img.width*e,h=img.height*e;g.drawImage(img,(1080-w)/2,(1080-h)/2,w,h);g.fillStyle='rgba(0,0,0,.48)';g.fillRect(0,0,1080,1080)}else{let z=g.createLinearGradient(0,0,1080,1080);z.addColorStop(0,p[0]);z.addColorStop(1,p[1]);g.fillStyle=z;g.fillRect(0,0,1080,1080)}g.strokeStyle='#ffffff88';g.lineWidth=2;g.strokeRect(60,60,960,960);g.textAlign='center';g.fillStyle=p[2];g.font='bold 43px Arial';g.fillText(D[ahora.getDay()].toUpperCase(),540,180);g.fillStyle='white';g.font='32px Arial';g.fillText(`${ahora.getDate()} de ${M[ahora.getMonth()]} de ${ahora.getFullYear()}`,540,235);g.font='bold 60px Georgia';let L=lineas(F[i],820),y=520-(L.length-1)*40;L.forEach((v,n)=>g.fillText(v,540,y+n*80));g.fillStyle=p[2];g.fillRect(440,805,200,4);g.fillStyle='white';g.font='bold 30px Arial';g.fillText(marca.value||'Inspira tu día',540,885);g.font='22px Arial';g.fillText('Una pausa para recordar lo importante',540,930);H[key]={i,t};localStorage.setItem('historial-frases',JSON.stringify(H))}
document.getElementById('f').onchange=e=>{let file=e.target.files[0];if(!file)return;let n=new Image();n.onload=()=>{img=n;draw();estado.textContent='Imagen de fondo agregada.'};n.src=URL.createObjectURL(file)};document.getElementById('q').onclick=()=>{img=null;document.getElementById('f').value='';draw()};document.getElementById('x').onclick=()=>{let used=new Set(Object.values(H).map(v=>v.i)),a=F.map((_,n)=>n).filter(n=>!used.has(n));if(!a.length)a=F.map((_,n)=>n);i=a[Math.floor(Math.random()*a.length)];t=(t+1)%T.length;draw()};document.getElementById('d').onclick=()=>{let a=document.createElement('a');a.download=`frase-${key}.png`;a.href=c.toDataURL('image/png');a.click()};function cargarAutomatico(){const n=new Image();n.onload=()=>{img=n;draw();estado.textContent='Fondo automático del día cargado.'};n.onerror=()=>{img=null;draw();estado.textContent='No se pudo cargar el fondo automático.'};n.src=fondos[ahora.getDate()%fondos.length]+'?v=1'}
document.getElementById('auto').onclick=cargarAutomatico;marca.oninput=draw;cargarAutomatico();
</script></body></html>
