<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador diario de inspiración</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#020617;color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding:22px}
    .app{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px;flex-wrap:wrap}
    h1{font-size:clamp(30px,5vw,52px);margin:6px 0}.sub{color:#cbd5e1}.free{color:#86efac;border:1px solid #22c55e66;background:#22c55e1a;padding:10px 15px;border-radius:999px}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:24px}.card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:24px;padding:18px}
    canvas{display:block;width:100%;border-radius:18px}.panel h2{margin-top:0}.info{background:#0003;padding:14px;border-radius:14px;color:#cbd5e1}
    label{display:block;margin:18px 0 7px;color:#cbd5e1}.input{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff22;background:#0f172a;color:#fff;font-size:16px}
    button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;font-weight:bold;font-size:16px;cursor:pointer}
    .secondary{background:#ffffff16;color:#fff}.primary{background:#22d3ee;color:#082f49}.status{font-size:13px;color:#86efac;min-height:30px;margin-top:12px}
    .small{font-size:13px;color:#94a3b8;line-height:1.5}.badge{color:#fde68a;font-weight:bold;font-size:13px}
    @media(max-width:850px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="badge">✨ HERRAMIENTA GRATUITA</div><h1>Generador diario de inspiración</h1><div class="sub">Crea una imagen distinta cada día y descárgala para Facebook.</div></div>
    <div class="free">✓ Sin suscripciones</div>
  </div>
  <div class="grid">
    <div class="card"><canvas id="canvas" width="1080" height="1080"></canvas></div>
    <div class="card panel">
      <h2>Publicación de hoy</h2>
      <div class="info"><strong id="fechaPanel"></strong><br><span id="numeroFrase"></span></div>
      <label for="marca">Nombre o firma</label>
      <input class="input" id="marca" value="Inspira tu día" maxlength="40">
      <button class="secondary" id="cambiar">🔄 Cambiar diseño y frase</button>
      <button class="primary" id="descargar">⬇ Descargar PNG</button>
      <div class="status" id="estado"></div>
      <p class="small">La fecha se coloca automáticamente. El navegador guarda las frases usadas para reducir repeticiones.</p>
    </div>
  </div>
</div>
<script>
const frases=[
"Cada mañana trae una nueva oportunidad para avanzar.","Los pequeños pasos de hoy construyen los grandes logros de mañana.","Confía en tu proceso, incluso cuando avances lentamente.","Tu actitud puede transformar por completo tu día.","Hoy tienes una nueva oportunidad para hacerlo mejor.","La constancia convierte los sueños en resultados.","No necesitas ser perfecto, solo seguir avanzando.","Cree en ti y en todo lo que todavía puedes lograr.","Cada esfuerzo cuenta, aunque nadie más lo vea.","Tu mejor momento para comenzar es ahora.","La disciplina te acerca a donde la motivación quiere llevarte.","Haz de este día una razón para sentirte orgulloso.","Lo que haces hoy puede mejorar todos tus mañanas.","Avanza con calma, pero nunca abandones tu camino.","Las metas grandes se alcanzan con decisiones pequeñas y constantes.","Tu historia sigue escribiéndose. Haz que hoy cuente.","La paciencia también es una forma de fortaleza.","Atrévete a dar el paso que has estado posponiendo.","Tu esfuerzo de hoy será tu tranquilidad de mañana.","Hoy puede ser el inicio de algo extraordinario.","Todo cambio importante comienza con una decisión valiente.","Respira, reorganiza tus ideas y vuelve a intentarlo.","Un día a la vez también es una forma de llegar lejos.","Celebra tus avances, incluso los que parecen pequeños.","Nunca subestimes el poder de volver a comenzar.","Haz lo mejor que puedas con lo que tienes hoy.","Permite que tus sueños sean más grandes que tus miedos.","La gratitud convierte lo cotidiano en algo extraordinario.","Tu paz también es una prioridad.","Un buen día comienza con una buena intención."
];
const temas=[
["#071952","#35A29F","#FFE17B"],["#3D246C","#F875AA","#FFD6A5"],["#163020","#B6C4B6","#EEF0E5"],["#001C30","#64CCC5","#DAFFFB"],["#111827","#7C3AED","#FDE68A"]];
const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const hoy=new Date(); const clave=`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-${String(hoy.getDate()).padStart(2,'0')}`;
let historial={}; try{historial=JSON.parse(localStorage.getItem('historial-frases')||'{}')}catch(e){}
let indice=historial[clave]?.frase ?? (Math.abs([...clave].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%frases.length);
let tema=historial[clave]?.tema ?? (hoy.getDate()%temas.length);
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),marca=document.getElementById('marca');
function guardar(){historial[clave]={frase:indice,tema};localStorage.setItem('historial-frases',JSON.stringify(historial));}
function envolver(texto,max){const palabras=texto.split(' '),lineas=[];let linea='';for(const p of palabras){const prueba=(linea+' '+p).trim();if(ctx.measureText(prueba).width>max&&linea){lineas.push(linea);linea=p}else linea=prueba}if(linea)lineas.push(linea);return lineas}
function dibujar(){
 const t=temas[tema],g=ctx.createLinearGradient(0,0,1080,1080);g.addColorStop(0,t[0]);g.addColorStop(1,t[1]);ctx.fillStyle=g;ctx.fillRect(0,0,1080,1080);
 ctx.globalAlpha=.13;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(930,120,270,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(100,980,330,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 ctx.strokeStyle='#ffffff66';ctx.lineWidth=2;ctx.strokeRect(62,62,956,956);ctx.textAlign='center';
 ctx.fillStyle=t[2];ctx.font='600 42px Arial';ctx.fillText(dias[hoy.getDay()].toUpperCase(),540,180);
 ctx.fillStyle='#fff';ctx.font='32px Arial';ctx.fillText(`${hoy.getDate()} de ${meses[hoy.getMonth()]} de ${hoy.getFullYear()}`,540,235);
 ctx.font='bold 60px Georgia';const lineas=envolver(frases[indice],820),lh=80,inicio=520-((lineas.length-1)*lh/2);lineas.forEach((l,i)=>ctx.fillText(l,540,inicio+i*lh));
 ctx.fillStyle=t[2];ctx.fillRect(440,805,200,4);ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.fillText(marca.value||'Inspira tu día',540,885);ctx.font='22px Arial';ctx.fillText('Una pausa para recordar lo importante',540,930);
 document.getElementById('fechaPanel').textContent=`${dias[hoy.getDay()]}, ${hoy.getDate()} de ${meses[hoy.getMonth()]}`;document.getElementById('numeroFrase').textContent=`Frase ${indice+1} de ${frases.length}`;guardar();
}
document.getElementById('cambiar').onclick=()=>{const usadas=new Set(Object.values(historial).map(x=>x.frase));let disponibles=frases.map((_,i)=>i).filter(i=>!usadas.has(i));if(!disponibles.length)disponibles=frases.map((_,i)=>i);indice=disponibles[Math.floor(Math.random()*disponibles.length)];tema=(tema+1)%temas.length;dibujar();document.getElementById('estado').textContent='Nueva combinación creada.'};
document.getElementById('descargar').onclick=()=>{const a=document.createElement('a');a.download=`frase-inspiradora-${clave}.png`;a.href=canvas.toDataURL('image/png');a.click();document.getElementById('estado').textContent='Imagen descargada, lista para publicar.'};
marca.oninput=dibujar;dibujar();
</script>
</body>
</html>
